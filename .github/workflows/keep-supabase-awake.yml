name: Keep Supabase awake

# Supabase pauses free-tier projects after 7 days with no API activity.
# This app is a low-traffic family inventory list that can easily go quiet
# that long, so ping the REST API twice a week (well inside the 7-day
# window) just to keep the project counted as "active". No real data is
# read or changed — the request itself is what counts.
on:
  schedule:
    - cron: "0 3 * * 1,4" # every Monday and Thursday at 03:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/lists?select=id&limit=1" \
            -o /dev/null
        env:
          SUPABASE_URL: https://yswepejilrzwbokxrvle.supabase.co
          # This is Supabase's public "anon"/publishable key, not a secret — it's the
          # same key already shipped inside the app's browser bundle and is only ever
          # allowed to do what the database's row-level security policies permit.
          SUPABASE_ANON_KEY: sb_publishable_n-PXetbwS7HNJi_CqRj9wQ_oHCpO3hm
